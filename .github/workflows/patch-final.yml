name: Final bot patch
on:
  push:
    paths:
      - .github/workflows/patch-final.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python patch_once.py
      - name: Validate Python
        run: python -m py_compile main.py
      - name: Commit changes and clean up
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f patch_once.py .github/workflows/patch-final.yml .github/workflows/patch-gemini-video-retry.yml
          git add -A
          git commit -m "fix: retry Gemini outages and analyze replied videos"
          git push
