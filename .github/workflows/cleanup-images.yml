name: Remove image slideshow code

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    if: ${{ !contains(github.event.head_commit.message, 'Remove image slideshow support') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove image slideshow feature
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('main.py')
          s = p.read_text()
          s = s.replace('    InputMediaPhoto, InputRichMessage, InputRichBlockParagraph,\n', '    InputRichMessage, InputRichBlockParagraph,\n')
          s = s.replace('    InputRichBlockListItem, InputRichBlockSlideshow, InputRichBlockPhoto,\n', '    InputRichBlockListItem,\n')
          s = re.sub(r'\ndef detect_media_intent\(.*?\nasync def searx_request', '\nasync def searx_request', s, flags=re.S)
          s = re.sub(r'\nasync def free_image_search\(.*?\nasync def send_ai_response', '\nasync def send_ai_response', s, flags=re.S)
          s = re.sub(r'\nasync def send_rich_slideshow\(.*?\ndef render_math_markup', '\ndef render_math_markup', s, flags=re.S)
          s = re.sub(r'\n        if detect_media_intent\(prompt\):.*?(?=\n        use_search = detect_search_intent\(prompt\))', '', s, flags=re.S)
          p.write_text(s)
          PY

      - name: Commit cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add main.py .github/workflows/cleanup-images.yml
          git commit -m 'Remove image slideshow support' || exit 0
          git push
